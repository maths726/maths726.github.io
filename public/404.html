<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects all 404s to index.html while preserving the path
      const basePath = '/suivi-client';
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      // Store the intended path and redirect to the base
      sessionStorage.setItem('spa-redirect', path + search + hash);
      window.location.replace(basePath + '/');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
